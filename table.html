 <!-- ========================= -->
    <!-- HTML TABLE -->
    <!-- ========================= -->

    <h1>HTML Table</h1>

    <p>
        An HTML table organizes information into rows and columns.
    </p>

    <table border="1">

        <!-- Table Heading -->
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Favorite Car</th>
        </tr>

        <!-- First Row -->
        <tr>
            <td>John</td>
            <td>20</td>
            <td>Audi</td>
        </tr>

        <!-- Second Row -->
        <tr>
            <td>Mike</td>
            <td>22</td>
            <td>BMW</td>
        </tr>

        <!-- Third Row -->
        <tr>
            <td>Sarah</td>
            <td>21</td>
            <td>Mercedes</td>
        </tr>

    </table>
